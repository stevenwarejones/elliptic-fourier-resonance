name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      audits:
        description: Run optional exact geometry and floating-point path audits
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Replay Fourier certificate
        run: python verify_fourier.py
      - name: Replay exact bounded-reduction certificate
        run: python verify_bounded_reduction.py
      - name: Check reproduction leaves the checkout clean
        run: test -z "$(git status --porcelain)"

  audits:
    if: github.event_name == 'workflow_dispatch' && inputs.audits
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audit.txt
      - name: Install optional audit dependencies
        run: python -m pip install -r requirements-audit.txt
      - name: Audit exact geometry
        run: python audit_geometry.py
      - name: Cross-check numerical paths (not a rigorous certificate)
        run: python check_torus_path.py
      - name: Check reproduction leaves the checkout clean
        run: test -z "$(git status --porcelain)"
